  .stars span.on { filter: none; }
  .stars span.now { filter: none; transform: scale(1.25); }

  .mascot { animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .bubble {

  .pick.on { background: var(--c); border: 4px solid #5A4425; transform: scale(1.04); box-shadow: 0 5px 0 #C9A85C; }
  .pick.off { opacity: .4; pointer-events: none; }
  .pick .chk { position: absolute; top: -10px; right: -6px; font-size: 24px; display: none; }
  .pick.on .chk { display: block; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 6px; }
  .chip { background: var(--c); border: 2px solid #5A4425; border-radius: 999px; padding: 6px 14px; font-size: 15px; }

  .guideCard {

function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 0.88; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ─── 상태 ─── */
let state = { step:"age", age:null, minds:[], bodies:[] };

/* ─── 마스코트 SVG ─── */
function mascot(mood, size, bounce) {
  const eyes = mood === "big"
    ? `<path d="M 32 50 Q 38 42 44 50" stroke="#5A4425" stroke-width="4" fill="none" stroke-linecap="round"/>
       <path d="M 66 50 Q 72 42 78 50" stroke="#5A4425" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="38" cy="50" r="4.5" fill="#5A4425"/><circle cx="72" cy="50" r="4.5" fill="#5A4425"/>`;
  const mouth = mood === "big" ? "M 36 62 Q 55 86 74 62" : mood === "calm" ? "M 40 68 Q 55 74 70 68" : "M 38 66 Q 55 80 72 66";
  return `<div class="${bounce ? "mascot" : ""}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 110 110" width="100%" height="100%">
      <defs><radialGradient id="mg" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#FFE9A8"/><stop offset="100%" stop-color="#FFC94D"/>
      </radialGradient></defs>
      <ellipse cx="55" cy="58" rx="46" ry="44" fill="url(#mg)"/>
      <ellipse cx="55" cy="58" rx="46" ry="44" fill="none" stroke="#E8A93B" stroke-width="2.5"/>
      <circle cx="30" cy="66" r="7" fill="#FFAD8F" opacity="0.7"/><circle cx="80" cy="66" r="7" fill="#FFAD8F" opacity="0.7"/>
      ${eyes}
      <path d="${mouth}" stroke="#5A4425" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 55 14 Q 55 6 62 4" stroke="#7FB069" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="66" cy="4" rx="6" ry="4" fill="#9CC97F" transform="rotate(20 66 4)"/>
    </svg></div>`;
}

function bubble(text) {
  return `<div class="bubble"><p>${text}</p>
    <button class="speakBtn" aria-label="소리로 듣기" onclick="speak('${text.replace(/'/g,"\\'")}')">🔊</button></div>`;
}

function stars(idx) {
  let s = '<div class="stars">';
  for (let i = 0; i < 5; i++) s += `<span class="${i < idx ? "on" : i === idx ? "now" : ""}">⭐</span>`;
  return s + "</div>";
}

function chips() {
  const items = [...MIND.filter(m=>state.minds.includes(m.id)), ...BODY.filter(b=>state.bodies.includes(b.id))];
  return `<div class="chips">${items.map(x=>`<span class="chip" style="--c:${x.color}">${x.emoji} ${x.label}</span>`).join("")}</div>`;
}

/* ─── 지침 생성 ─── */
function buildGuide() {
  const ageKey = state.age;
  const steps = [];
  const bodyHit = BODY_PRIORITY.find(b => state.bodies.includes(b));
  if (bodyHit) steps.push(BODY_FIRST[bodyHit][ageKey]);
  state.minds.forEach((m, i) => {
    const g = MIND_GUIDE[m][ageKey] || [];
    const take = state.minds.length === 2 ? (i === 0 ? 2 : 1) : g.length;
    g.slice(0, take).forEach(s => steps.push(s));
  });
  return steps.slice(0, 4);
}

/* ─── 이벤트 ─── */
function pickAge(a) {
  state.age = a; state.step = "mind";
  speak(a === "toddler" ? "유아 친구구나! 엄마 아빠랑 같이 하자" : "아동 친구구나! 혼자서도 잘할 수 있어");
  render();
}
function togglePick(kind, id) {
  const list = state[kind];
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1);
  else if (list.length < 2) {
    list.push(id);
    const item = (kind === "minds" ? MIND : BODY).find(x => x.id === id);
    speak(item.label);
  }
  render();
}
function go(step) { state.step = step; render(); }
function restart() { state = { step:"age", age:null, minds:[], bodies:[] }; try{speechSynthesis.cancel();}catch(e){} render(); }

/* ─── 렌더 ─── */
function render() {
  const app = document.getElementById("app");
  const isT = state.age === "toddler";
  const stepIdx = { age:0, mind:1, body:2, guide:3, parent:4, end:4 }[state.step];
  let html = `<h1>🌈 마음코치</h1>${stars(stepIdx)}`;
  let autoText = null;

  if (state.step === "age") {
    autoText = "안녕! 나는 마음이야. 몇 살 친구인지 골라 줘!";
    html += `<div class="center">${mascot("smile",110,true)}${bubble(autoText)}</div>
      <div class="grid2">
        <button class="ageCard" style="--c:#FFD9C4" onclick="pickAge('toddler')">
          <span class="e">👶🧑‍🤝‍🧑</span><span class="t">유아</span><span class="s">만 2–4세 · 엄마 아빠랑 같이</span></button>
        <button class="ageCard" style="--c:#C8E7DC" onclick="pickAge('child')">
          <span class="e">🧒⭐</span><span class="t">아동</span><span class="s">만 5–8세 · 나 혼자서도 OK</span></button>
      </div>`;
  }

  if (state.step === "mind") {
    autoText = isT ? "지금 마음이 어때? 엄마 아빠랑 같이 골라 봐. 두 개까지 괜찮아!"
                   : "지금 네 마음은 어때? 잘 들여다보고 골라 봐. 두 개까지 고를 수 있어!";
    const list = MIND.filter(m => isT ? m.toddler : true);
    html += `<div style="display:flex;align-items:flex-end;gap:8px">${mascot("smile",76,false)}${bubble(autoText)}</div>
      <div class="grid2">${list.map(m => `
        <button class="pick ${state.minds.includes(m.id) ? "on" : state.minds.length>=2 ? "off":""}" style="--c:${m.color}"
          onclick="togglePick('minds','${m.id}')">
          <span class="chk">✅</span><span class="e">${m.emoji}</span><span class="t">${m.label}</span></button>`).join("")}
      </div>
      <button class="bigBtn" ${state.minds.length===0?"disabled":""} onclick="go('body')">다 골랐어요 ➜</button>`;
  }

  if (state.step === "body") {
    autoText = isT ? "이번엔 몸이야! 지금 몸은 어때? 같이 골라 봐" : "이번엔 몸 상태야. 지금 몸은 어떤지 골라 봐. 두 개까지!";
    html += `<div style="display:flex;align-items:flex-end;gap:8px">${mascot("calm",76,false)}${bubble(autoText)}</div>
      <div class="grid2">${BODY.map(b => `
        <button class="pick ${state.bodies.includes(b.id) ? "on" : state.bodies.length>=2 ? "off":""}" style="--c:${b.color}"
          onclick="togglePick('bodies','${b.id}')">
          <span class="chk">✅</span><span class="e">${b.emoji}</span><span class="t">${b.label}</span></button>`).join("")}
      </div>
      <div class="row">
        <button class="bigBtn gray" onclick="go('mind')">⬅ 뒤로</button>
        <button class="bigBtn" ${state.bodies.length===0?"disabled":""} onclick="go('guide')">다 골랐어요 ➜</button>
      </div>`;
  }

  if (state.step === "guide") {
    autoText = isT ? "마음을 잘 찾았네! 이제 엄마 아빠랑 이렇게 해 보자" : "네 마음을 잘 찾았어! 정말 멋져. 이제 이렇게 해 보자";
    const gs = buildGuide();
    html += chips()
      + `<div style="display:flex;align-items:flex-end;gap:8px">${mascot("big",76,true)}${bubble(autoText)}</div>
      <div style="width:100%">${gs.map((g,i) => `
        <button class="guideCard" style="animation-delay:${i*0.15}s" onclick="speak('${g.t.replace(/'/g,"\\'")}')">
          <span class="num">${i+1}</span><span class="e">${g.e}</span><span class="t">${g.t}</span><span>🔊</span></button>`).join("")}
      </div>
      <p class="hint">카드를 누르면 소리로 들려줘요 🔊</p>
      <button class="bigBtn green" onclick="go('parent')">${isT ? "다 했어요! 부모님 차례 ➜" : "다 했어요! ➜"}</button>`;
  }

  if (state.step === "parent") {
    html += `<div class="parentHead"><p>👨‍👩‍👧 부모님을 위한 안내</p>
      <small>${isT ? "아이가 고른 마음과 몸 상태에 맞춘 대처 조언이에요."
                   : "아이가 혼자 과제를 마쳤어요. 곁에 계시다면 함께 읽어 주세요. (아이 혼자라면 건너뛰어도 돼요)"}</small></div>
      <div style="margin-top:10px">${chips()}</div>
      ${state.bodies.map(b => { const x = BODY.find(v=>v.id===b); return `
        <div class="advice"><b>${x.emoji} 몸 상태 · ${x.label}</b><p>${PARENT_BODY[b]}</p></div>`; }).join("")}
      ${state.minds.map(m => { const x = MIND.find(v=>v.id===m); return `
        <div class="advice"><b>${x.emoji} 마음 · ${x.label}</b><p>${PARENT_MIND[m]}</p></div>`; }).join("")}
      <p class="note">※ 일반적인 육아 정보이며, 전문 상담을 대신하지 않습니다.</p>
      <button class="bigBtn" onclick="go('end')">확인했어요 ➜</button>`;
  }

  if (state.step === "end") {
    autoText = isT ? "오늘 마음 찾기 참 잘했어요! 엄마 아빠랑 꼬옥 안아 주세요. 다음에 또 만나, 안녕!"
                   : "오늘 네 마음을 스스로 잘 들여다봤어! 정말 대단해. 다음에 또 만나자, 안녕!";
    html += `<div class="center">
      <div style="font-size:44px;animation:pop .5s ease">🎉🏅🎉</div>
      ${mascot("big",130,true)}${bubble(autoText)}
      <div class="stamp">⭐ 참 잘했어요 도장 ⭐</div>
      <button class="bigBtn green" onclick="restart()">🌈 처음부터 다시 하기</button>
    </div>`;
  }

  app.innerHTML = html;
  window.scrollTo(0, 0);
  if (autoText) setTimeout(() => speak(autoText), 350);
}

render();
</script>
</body>
</html>
